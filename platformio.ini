; SLA-USB: ESP32-S3 (N16R8) that acts as a USB stick for a resin printer
; and receives print files over Wi-Fi.
;
; Upload/monitor go through the CH343 port ("UART"/"COM", COM3 here).
; The printer connects to the other, native USB port.
; After the first wired flash, firmware can also be updated over Wi-Fi:
;   python tools/slausb.py ota .pio/build/sla-usb/firmware.bin

[env:sla-usb]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi   ; 8 MB octal PSRAM (stream cache)

upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 115200

; Native USB runs TinyUSB (mass storage); Serial stays on UART0 -> CH343.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
